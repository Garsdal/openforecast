name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov

      - name: Assert no forecasting framework in the dependency tree
        run: |
          uv tree --no-dev > tree.txt
          cat tree.txt
          ! grep -Eiq '(neural|stats|ml|hierarchical)forecast|darts|sktime|torch|jax|tensorflow|lightgbm|xgboost' tree.txt

  # Each integration is its own distribution in its own environment, which is
  # the whole point of the provider boundary — so it is also its own job. The
  # forecasting framework it depends on never reaches the job above.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [nixtla]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync ${{ matrix.integration }}
        working-directory: integrations/${{ matrix.integration }}
        run: uv sync --python ${{ matrix.python-version }}

      - name: Test ${{ matrix.integration }}
        working-directory: integrations/${{ matrix.integration }}
        run: uv run pytest
