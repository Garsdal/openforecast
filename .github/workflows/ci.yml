name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov

      # Rule 7: OpenAPI is a projection of OpenForecast semantics, never their
      # source. The document is generated from the Pydantic request/response
      # models and committed, so a change to what a fit request means shows up
      # here as a diff rather than as a spec that quietly disagrees with the
      # code the generated SDKs are built against.
      - name: Assert the committed OpenAPI document is the generated one
        run: |
          uv run generate-openapi
          git diff --exit-code spec/openapi/openapi.json

      # Step 25's version of the same rule, for the reference documentation: the
      # pages under docs/reference/generated are generated from the public
      # surface, committed, and diffed here, so a renamed parameter or a
      # rewritten docstring is a diff rather than documentation that quietly
      # disagrees with the library. The examples beside them are executed by the
      # test step above.
      - name: Assert the committed reference documentation is the generated one
        run: |
          uv run generate-reference
          git diff --exit-code docs/reference/generated

      # Step 27.1, and the same rule again: the JSON Schemas under spec/schemas
      # are generated from the Pydantic models the commands validate against, so
      # a renamed field is a diff here rather than a schema an agent constructs a
      # request from and is then refused for.
      - name: Assert the committed JSON Schemas are the generated ones
        run: |
          uv run generate-schemas
          git diff --exit-code spec/schemas

      - name: Assert no forecasting framework in the dependency tree
        run: |
          uv tree --no-dev > tree.txt
          cat tree.txt
          ! grep -Eiq '(neural|stats|ml|hierarchical)forecast|darts|sktime|scikit-learn|torch|jax|tensorflow|lightgbm|xgboost' tree.txt

  # The site itself. `--strict` turns an unresolved link, an unknown nav entry
  # and a page missing from the nav into failures, so the documentation build is
  # a check rather than an artifact. The executed examples and the structural
  # assertions run in the job above, which needs no static-site generator: this
  # one is the only place the docs group is installed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync with the docs group
        run: uv sync --group docs

      - name: Build the site
        run: uv run mkdocs build --strict

  # The core install is `pydantic`, `pyarrow` and `platformdirs`, and the HTTP
  # projection does not change that: serving needs `openforecast[server]`, and
  # *calling* a service needs nothing at all. This job is the only one that
  # installs neither the dev group nor the extra, so a web framework that had
  # crept into the runtime dependencies would fail here rather than in a user's
  # container.
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync without the dev group or any extra
        run: uv sync --no-dev --no-editable

      - name: Import the package and a remote client
        run: |
          uv run --no-dev python -c "
          import openforecast as of
          client = of.OpenForecast(transport=of.HttpTransport('http://localhost:8321'))
          print(client, of.models.list())
          "

  # Each integration is its own distribution in its own environment, which is
  # the whole point of the provider boundary — so it is also its own job. The
  # forecasting framework it depends on never reaches the job above.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [nixtla, darts, sklearn, sktime, chronos]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync ${{ matrix.integration }}
        working-directory: integrations/${{ matrix.integration }}
        run: uv sync --python ${{ matrix.python-version }}

      - name: Test ${{ matrix.integration }}
        working-directory: integrations/${{ matrix.integration }}
        run: uv run pytest

  # The Chronos integration's ordinary run answers a stand-in pipeline, because
  # a checkpoint is a download and none of the generated conformance assertions
  # are about the numbers. This job is the one that runs the real weights, so
  # that a change to the library's own API — a renamed keyword, a different
  # tensor layout — fails here rather than in a user's environment.
  chronos-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync chronos
        working-directory: integrations/chronos
        run: uv sync

      - name: Forecast with the real checkpoint
        working-directory: integrations/chronos
        run: uv run pytest -m weights

  # The job above tests each integration beside its own library. This one is the
  # opposite: an OpenForecast install that has never heard of any of them,
  # reaching all three over the subprocess protocol, exactly as a user's would.
  # It is the only place the three meet, so it is the only place that can show
  # that switching between them changes a reference and nothing else.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync

      # What a user runs. Each builds its own uv environment from the checkout,
      # and the frameworks inside them never reach the one running the tests.
      - name: Install the provider environments
        run: |
          uv run openforecast providers install nixtla
          uv run openforecast providers install darts
          uv run openforecast providers install sklearn
          uv run openforecast providers install sktime
          uv run openforecast providers install amazon
          uv run openforecast providers list

      # OPENFORECAST_E2E turns a missing provider from a skip into a failure:
      # the environments were just installed, so anything skipped here is a
      # suite that passed by not running.
      - name: The public V1 experience, end to end
        env:
          OPENFORECAST_E2E: "1"
        run: uv run pytest tests/e2e/test_v1_experience.py -q
