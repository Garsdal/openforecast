[project]
name = "openforecast-chronos"
description = "Amazon Chronos foundation models for OpenForecast, in their own environment"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    # The integration depends on OpenForecast; OpenForecast never depends on it.
    "openforecast",
    # Chronos-2 arrived in the 2.x line; the 1.x pipelines are a different API.
    "chronos-forecasting>=2.2,<3",
    # What a pipeline is handed and what it answers with. chronos brings both
    # anyway; they are declared because this distribution imports them directly
    # rather than inheriting them by accident.
    "numpy>=1.24",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/Garsdal/openforecast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One source of truth: the provider version an artifact records is the version
# of the distribution that produced it. A zero-shot forecast publishes no
# artifact, so here it is the version a `providers list` reports.
path = "src/openforecast_chronos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openforecast_chronos"]

[tool.uv.sources]
# A checkout builds against the OpenForecast beside it. A published install
# resolves the published distribution instead.
openforecast = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # The conformance suite of the OpenForecast checkout is what an integration
    # inherits, and it builds its golden datasets with pandas. chronos depends
    # on pandas already; it is declared here for the same reason the others do.
    "pandas>=2,<3",
]

# Lint and format are the repository's, not this distribution's: the root
# `ruff check .` covers `integrations/`, and one style across the boundary is
# the point. Nothing here overrides it.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The weights tests are deselected by default; `-m weights` on the command line
# overrides this and runs them.
addopts = "-ra --strict-markers --strict-config -m 'not weights'"
markers = [
    # Everything that needs the pretrained weights, which are downloaded from
    # the Hugging Face Hub the first time a pipeline is loaded. Deselected by
    # default so that a test run is not a network call: `-m weights` opts in.
    "weights: needs the Chronos checkpoint to be downloadable",
]
