[project]
name = "openforecast-nixtla"
description = "Nixtla models for OpenForecast, in their own environment"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    # The integration depends on OpenForecast; OpenForecast never depends on it.
    "openforecast",
    "statsforecast>=2,<3",
    # Nixtla's libraries speak pandas, so the integration does too. Nothing
    # about that spelling escapes this distribution.
    "pandas>=2",
]

[project.urls]
Homepage = "https://github.com/Garsdal/openforecast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# One source of truth: the provider version an artifact records is the version
# of the distribution that fitted it.
path = "src/openforecast_nixtla/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openforecast_nixtla"]

[tool.uv.sources]
# A checkout builds against the OpenForecast beside it. A published install
# resolves the published distribution instead.
openforecast = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # The conformance suite of the OpenForecast checkout is what an integration
    # inherits, and it builds its golden datasets with pandas.
    "pandas>=2",
]

# Lint and format are the repository's, not this distribution's: the root
# `ruff check .` covers `integrations/`, and one style across the boundary is
# the point. Nothing here overrides it.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
