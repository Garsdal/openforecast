[project]
name = "openforecast"
version = "0.1.0"
description = "The unified interface for forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyarrow",
    "platformdirs",
]

[project.scripts]
openforecast = "openforecast.commands:main"

[project.urls]
Homepage = "https://github.com/Garsdal/openforecast"
Repository = "https://github.com/Garsdal/openforecast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openforecast"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # pyarrow ships no type information, so strict pyright needs the stubs.
    "pyarrow-stubs>=20",
    # pandas is a test dependency only: from_pandas converts at the edge.
    "pandas>=3",
    "pandas-stubs>=3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# PLAN.md's fenced blocks are illustrative sketches, not code to be formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/openforecast"]
